<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil - UniHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand"><i class="fas fa-graduation-cap"></i><span>UniHub</span></div>
    <div class="navbar-nav">
      <button id="hamburger" style="display: none; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-primary);"><i class="fas fa-bars"></i></button>
      <button id="notification-bell" class="navbar-icon-btn has-badge"><i class="fas fa-bell"></i><span class="badge">3</span></button>
      <button id="theme-toggle" class="navbar-icon-btn"><i class="fas fa-moon"></i></button>
      <div class="dropdown">
        <button id="user-button" class="navbar-icon-btn"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Jean" alt="Profile" style="width: 36px; height: 36px; border-radius: 50%;"></button>
        <div id="user-menu" class="dropdown-menu">
          <button class="dropdown-item" data-i18n="common.profile"></button>
          <button class="dropdown-item" data-i18n="common.settings"></button>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item" onclick="logout()" data-i18n="common.logout"></button>
        </div>
      </div>
    </div>
  </nav>

  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <aside id="sidebar" class="sidebar">
    <button id="close-sidebar"><i class="fas fa-times"></i></button>
    <nav>
      <ul class="sidebar-nav">
        <li><a href="../student/dashboard.html"><i class="fas fa-chart-line"></i> <span data-i18n="student.sidebar.dashboard"></span></a></li>
        <li><a href="../student/courses.html"><i class="fas fa-book"></i> <span data-i18n="student.sidebar.courses"></span></a></li>
        <li><a href="../student/assignments.html"><i class="fas fa-tasks"></i> <span data-i18n="student.sidebar.assignments"></span></a></li>
        <li><a href="../student/timetable.html"><i class="fas fa-calendar"></i> <span data-i18n="student.sidebar.timetable"></span></a></li>
        <li><a href="../student/results.html"><i class="fas fa-graduation-cap"></i> <span data-i18n="student.sidebar.results"></span></a></li>
        <li><a href="../student/fees.html"><i class="fas fa-wallet"></i> <span data-i18n="student.sidebar.fees"></span></a></li>
        <li><a href="../student/announcements.html"><i class="fas fa-bullhorn"></i> <span data-i18n="student.sidebar.announcements"></span></a></li>
        <li><a href="../student/messages.html"><i class="fas fa-envelope"></i> <span data-i18n="student.sidebar.messages"></span></a></li>
        <li><a href="../student/calendar.html"><i class="fas fa-calendar-alt"></i> <span data-i18n="student.sidebar.calendar"></span></a></li>
        <li><a href="../student/profile.html"><i class="fas fa-user"></i> <span data-i18n="student.sidebar.profile"></span></a></li>
      </ul>
    </nav>
  </aside>

  <div class="main-container">
    <div class="main-content">
      <h1 data-i18n="common.profile"></h1>
      <div class="card" style="max-width: 600px;">
        <div style="text-align: center; padding: 2rem 0;">
          <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Jean" alt="Profile" style="width: 120px; height: 120px; border-radius: 50%; margin-bottom: 1rem;">
          <h2 style="color: var(--text-primary);">Jean Dupont</h2>
          <p style="color: var(--text-secondary); margin: 0;">STU001 | Computer Science</p>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div>
            <label style="color: var(--text-secondary); font-size: 0.9rem;">Email</label>
            <p style="color: var(--text-primary); margin: 0.5rem 0 1rem 0;">jean.dupont@university.com</p>
          </div>
          <div>
            <label style="color: var(--text-secondary); font-size: 0.9rem;">Téléphone</label>
            <p style="color: var(--text-primary); margin: 0.5rem 0 1rem 0;">+242 06 123 45 67</p>
          </div>
          <div>
            <label style="color: var(--text-secondary); font-size: 0.9rem;">Ville</label>
            <p style="color: var(--text-primary); margin: 0.5rem 0 1rem 0;">Brazzaville</p>
          </div>
          <div>
            <label style="color: var(--text-secondary); font-size: 0.9rem;">Pays</label>
            <p style="color: var(--text-primary); margin: 0.5rem 0 1rem 0;">Congo-Brazzaville</p>
          </div>
        </div>

        <div style="margin-top: 2rem; border-top: 1px solid var(--border-color); padding-top: 1rem;">
          <button class="btn btn-primary" style="margin-right: 0.5rem;" data-i18n="common.edit"></button>
          <button class="btn btn-secondary" data-i18n="common.cancel"></button>
        </div>
      </div>
    </div>
  </div>

  <script src="../data/mock-data.js"></script>
  <script src="../js/language.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/script.js"></script>
</body>
</html>
