<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - UniHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Skip to Main Content Link -->
  <a href="#login-form" class="skip-link">Skip to login form</a>

  <!-- Top Controls -->
  <div class="top-right-controls">
    <label for="language-select" class="sr-only">Select language:</label>
    <select id="language-select" aria-label="Select language" style="padding: 0.5rem; border-radius: 0.25rem; border: 2px solid var(--border-color); background-color: var(--bg-primary); color: var(--text-primary); cursor: pointer;">
      <option value="fr">Français</option>
      <option value="en">English</option>
    </select>
    <button id="theme-toggle" class="navbar-icon-btn" style="position: relative;" aria-label="Toggle dark mode">
      <i class="fas fa-moon" aria-hidden="true"></i>
    </button>
  </div>

  <div class="login-container">
    <div class="login-left" aria-hidden="true">
      <div class="login-left-content">
        <div class="login-left-icon">
          <i class="fas fa-graduation-cap" aria-hidden="true"></i>
        </div>
        <h1>UniHub</h1>
        <p data-i18n="landing.hero.subtitle"></p>
      </div>
    </div>

    <main class="login-right" role="main">
      <form class="login-form" id="login-form" onsubmit="handleLogin(event)" novalidate>
        <div class="login-header">
          <h1 data-i18n="common.login"></h1>
          <p data-i18n="common.welcome"></p>
        </div>

        <div class="form-group">
          <label for="email" data-i18n="common.email"></label>
          <input type="email" id="email" name="email" placeholder="exemple@univ.com" required aria-describedby="email-help">
          <small id="email-help" style="color: var(--text-tertiary); display: block; margin-top: 0.25rem;">Enter your university email address</small>
        </div>

        <div class="form-group">
          <label for="password" data-i18n="common.password"></label>
          <input type="password" id="password" name="password" placeholder="••••••••" required aria-describedby="password-help">
          <small id="password-help" style="color: var(--text-tertiary); display: block; margin-top: 0.25rem;">Minimum 6 characters</small>
        </div>

        <div class="login-actions">
          <label>
            <input type="checkbox" id="remember" name="remember" aria-label="Remember me on this device"> <span data-i18n="common.rememberMe"></span>
          </label>
          <a href="#" data-i18n="common.forgotPassword" aria-label="Forgot password"></a>
        </div>

        <button type="submit" class="btn btn-primary login-button" data-i18n="common.login"></button>

        <div class="login-divider" aria-hidden="true">
          <span>Or</span>
        </div>

        <div class="login-footer">
          <p data-i18n-html="common.register"></p>
          <p style="margin-top: 0.5rem;">
            <a href="index.html">← <span data-i18n="common.back"></span></a>
          </p>
        </div>
      </form>
    </div>
  </div>

  <!-- Professional Footer -->
  <footer class="footer" role="contentinfo" style="margin-top: auto;">
    <div class="footer-content">
      <div class="footer-section">
        <h4>UniHub</h4>
        <p style="color: var(--text-secondary); font-size: 0.9rem;">Modern education platform</p>
      </div>
      <div class="footer-section">
        <h4>Product</h4>
        <ul>
          <li><a href="index.html">Features</a></li>
          <li><a href="#">Pricing</a></li>
        </ul>
      </div>
      <div class="footer-section">
        <h4>Support</h4>
        <ul>
          <li><a href="#">Help</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </div>
      <div class="footer-section">
        <h4>Legal</h4>
        <ul>
          <li><a href="#">Privacy</a></li>
          <li><a href="#">Terms</a></li>
        </ul>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2024 UniHub. All rights reserved.</p>
    </div>
  </footer>

  <script src="data/mock-data.js"></script>
  <script src="js/language.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/script.js"></script>
  <script>
    function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // Mock authentication - in production, this would call an API
      if (email && password) {
        // Store mock user and redirect to role selection
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('currentEmail', email);
        window.location.href = 'role-selection.html';
      }
    }
  </script>
</body>
</html>
