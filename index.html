<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniHub - Digital Campus Platform for Schools</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Landing Page Specific Styles */
    .navbar-landing {
      position: relative;
      z-index: 50;
    }

    .hero {
      background:
        linear-gradient(135deg, rgba(15, 23, 42, 0.84), rgba(37, 99, 235, 0.72)),
        url("https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=1800&q=80");
      background-size: cover;
      background-position: center;
      color: white;
      padding: 5rem 2rem 7rem;
      text-align: left;
      min-height: calc(100vh - 70px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      position: relative;
      isolation: isolate;
    }

    .hero-content {
      width: min(1120px, 100%);
      max-width: none;
      margin: 0 auto;
    }

    .hero h1 {
      max-width: 760px;
      font-size: clamp(2.6rem, 6vw, 5.8rem);
      margin-bottom: 1.25rem;
      color: white;
      letter-spacing: 0;
    }

    .hero p {
      max-width: 620px;
      font-size: 1.25rem;
      margin-bottom: 2rem;
      color: rgba(255, 255, 255, 0.88);
    }

    .hero-buttons {
      display: flex;
      gap: 1rem;
      justify-content: flex-start;
      flex-wrap: wrap;
    }

    .hero::after {
      content: "";
      position: absolute;
      left: 2rem;
      right: 2rem;
      bottom: 1.5rem;
      max-width: 1120px;
      height: 92px;
      margin: 0 auto;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.22);
    }

    .btn-hero {
      padding: 1rem 2.5rem;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .section {
      padding: 5rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 2.5rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 3rem;
      color: var(--text-primary);
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      margin-bottom: 3rem;
    }

    .feature-card {
      background-color: var(--bg-primary);
      padding: 2rem;
      border-radius: 1rem;
      text-align: center;
      box-shadow: var(--shadow);
      transition: var(--transition);
      border: 1px solid var(--border-color);
    }

    .feature-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-lg);
    }

    .feature-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.25rem;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.14), rgba(20, 184, 166, 0.14));
      color: var(--color-primary);
    }

    .feature-card h3 {
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }

    .feature-card p {
      color: var(--text-secondary);
    }

    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
    }

    .pricing-card {
      background-color: var(--bg-primary);
      padding: 2rem;
      border-radius: 1rem;
      text-align: center;
      border: 1px solid var(--border-color);
      transition: var(--transition);
    }

    .pricing-card.featured {
      border-color: var(--color-primary);
      box-shadow: var(--shadow-lg);
      transform: translateY(-0.75rem);
    }

    .pricing-card:hover {
      box-shadow: var(--shadow-lg);
    }

    .pricing-price {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--color-primary);
      margin: 1rem 0;
    }

    .pricing-features {
      list-style: none;
      margin: 2rem 0;
      text-align: left;
    }

    .pricing-features li {
      padding: 0.5rem 0;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-color);
    }

    .pricing-features li:before {
      content: "✓ ";
      color: var(--color-success);
      font-weight: 700;
      margin-right: 0.5rem;
    }

    .testimonials {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
    }

    .testimonial-card {
      background-color: var(--bg-primary);
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: var(--shadow);
      border-left: 4px solid var(--color-primary);
    }

    .testimonial-text {
      font-style: italic;
      margin-bottom: 1rem;
      color: var(--text-secondary);
    }

    .testimonial-author {
      font-weight: 600;
      color: var(--text-primary);
    }

    .faq-container {
      max-width: 800px;
      margin: 0 auto;
    }

    .faq-item {
      margin-bottom: 1.5rem;
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .faq-question {
      padding: 1.5rem;
      background-color: var(--bg-primary);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      color: var(--text-primary);
      transition: var(--transition);
    }

    .faq-question:hover {
      background-color: var(--bg-tertiary);
    }

    .faq-answer {
      padding: 0 1.5rem;
      max-height: 0;
      overflow: hidden;
      background-color: var(--bg-secondary);
      transition: var(--transition);
    }

    .faq-answer.active {
      padding: 1.5rem;
      max-height: 500px;
    }

    .faq-icon {
      transition: var(--transition);
    }

    .faq-icon.active {
      transform: rotate(180deg);
    }

    .footer {
      background-color: var(--bg-primary);
      border-top: 1px solid var(--border-color);
      padding: 3rem 2rem;
      margin-top: 5rem;
    }

    .footer-content {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .footer-section h4 {
      margin-bottom: 1rem;
      color: var(--text-primary);
    }

    .footer-section ul {
      list-style: none;
    }

    .footer-section ul li {
      margin-bottom: 0.5rem;
    }

    .footer-section a {
      color: var(--text-secondary);
      transition: var(--transition);
    }

    .footer-section a:hover {
      color: var(--color-primary);
    }

    .footer-bottom {
      border-top: 1px solid var(--border-color);
      padding-top: 2rem;
      text-align: center;
      color: var(--text-secondary);
    }

    @media (max-width: 768px) {
      .hero h1 {
        font-size: 2.35rem;
      }

      .hero p {
        font-size: 1rem;
      }

      .section {
        padding: 3rem 1.5rem;
      }

      .section-title {
        font-size: 1.75rem;
      }

      .hero-buttons {
        flex-direction: column;
        align-items: stretch;
      }

      .btn-hero {
        width: 100%;
      }

      .hero {
        min-height: 620px;
        text-align: center;
        align-items: center;
      }

      .hero p {
        margin-left: auto;
        margin-right: auto;
      }

      .hero::after {
        left: 1rem;
        right: 1rem;
        height: 64px;
      }

      .pricing-card.featured {
        transform: scale(1);
      }
    }
  </style>
</head>

<body>
  <!-- Navigation Bar -->
  <nav class="navbar navbar-landing">
    <div class="navbar-brand">
      <i class="fas fa-graduation-cap"></i>
      <span>UniHub</span>
    </div>
    <div class="navbar-nav">
      <select id="language-select"
        style="padding: 0.5rem; border-radius: 0.25rem; border: 1px solid var(--border-color); background-color: var(--bg-primary); color: var(--text-primary);">
        <option value="fr">Français</option>
        <option value="en">English</option>
      </select>
      <button id="theme-toggle" class="navbar-icon-btn">
        <i class="fas fa-moon"></i>
      </button>
      <a href="login.html" class="btn btn-primary btn-sm" data-i18n="common.login"></a>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h1 data-i18n="landing.hero.title"></h1>
      <p data-i18n="landing.hero.subtitle"></p>
      <div class="hero-buttons">
        <button class="btn btn-hero" style="background-color: white; color: var(--color-primary);"
          data-i18n="landing.hero.cta" onclick="window.location.href
